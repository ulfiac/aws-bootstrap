name: _terraform-docs
run-name: "_terraform-docs: ${{ github.ref_name }}"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '!terraform/**/README.md'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  terraform-docs:
    uses: ulfiac/commons/.github/workflows/reusable_terraform_docs.yaml@1ed024c2ce1eca617aa8cc21af56ec555f5b565e # v1.0.16
    with:
      find-dir: 'terraform'
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
