name: _terraform-docs
run-name: "_terraform-docs: ${{ github.ref_name }}"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '!terraform/**/README.md'
  workflow_dispatch: {}

concurrency:
  group: terraform-docs-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  terraform-docs:
    uses: ulfiac/commons/.github/workflows/reusable_terraform_docs.yaml@f59794cccc40cb197f7f0b5787f11a3de82bdf4f # v1.0.1
    with:
      find-dir: 'terraform'
